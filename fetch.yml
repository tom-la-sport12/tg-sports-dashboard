name: Fetch sports data

on:
  schedule:
    - cron: "0 6,12,18,22 * * *"   # UTC, four times a day
  workflow_dispatch:                # "Run workflow" button for manual runs

permissions:
  contents: write

# never run two at once (a manual run during a scheduled one would clash when saving)
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python fetch.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "Update data"
          # GitHub occasionally has a wobble when saving; try up to 4 times
          for attempt in 1 2 3 4; do
            git pull --rebase --strategy-option=theirs && git push && exit 0
            echo "Save failed (attempt $attempt), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
