# What to follow and where to find it. fetch.py reads this.
# Sources with TODO are skipped until filled in.

follows: what you care about, and where to find it (you edit this)
#   2. items: the normalised shape every fetcher writes out (the page reads this)
# TODO = an ID or URL still to look up
# Hosting: GitHub Pages + scheduled GitHub Action writing data.json

# ---------------------------------------------------------------
# 1. FOLLOWS
# ---------------------------------------------------------------

follows:

  - id: england-cricket
    kind: team
    sport: cricket
    name: England men
    aliases: ["England", "England cricket", "England men's cricket"]
    exclude: ["England women", "England Lions", "U19", "Under-19"]
    title_must_mention: true
    news:
      - type: google_news
        query: '"England" cricket -women -U19'
        lang: en-GB
    fixtures:
      provider: thesportsdb
      team_id: "137142"            # men; women are 145688, don't mix up
    highlights:
      # rights move with the host nation, so this list changes per series
      - type: youtube_channel
        name: England & Wales Cricket Board
        channel_id: TODO
        when: home series
      - type: youtube_channel
        name: host board for away series
        channel_id: TODO
        when: away series

  - id: bath
    kind: team
    sport: rugby
    name: Bath Rugby
    aliases: ["Bath Rugby", "Bath"]
    exclude: []
    title_must_mention: true
    news:
      - type: google_news
        query: '"Bath Rugby"'
        lang: en-GB
    fixtures:
      provider: thesportsdb
      team_id: "135199"            # current-season fixtures not yet confirmed
    highlights:
      - type: youtube_channel
        name: Premiership Rugby
        channel_id: TODO
        competitions: [Premiership]
      - type: youtube_channel
        name: EPCR
        channel_id: TODO
        competitions: [Champions Cup]

  - id: ubb
