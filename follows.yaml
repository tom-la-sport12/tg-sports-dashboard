# What to follow and where to find it. fetch.py reads this.
# Anything marked TODO is skipped until you fill it in.
#
# Highlights: open the channel on YouTube, copy the address from the
# address bar, and paste it in quotes after "handle:". Any channel link
# works (youtube.com/@Name, youtube.com/channel/UC..., youtube.com/Name),
# or just the @handle. The script works out the channel ID itself.
#
# match_on: aliases  = only keep videos that name the team or player
# match_on: all      = keep everything (for a club's own channel)

follows:

  - id: england-cricket
    kind: team
    sport: cricket
    name: England men
    aliases: ["England", "England cricket", "England men's cricket"]
    exclude: ["England women", "England Lions", "U19", "Under-19"]
    title_must_mention: true
    news:
      - type: google_news
        query: '"England" cricket -women -U19'
        lang: en-GB
    fixtures:
      provider: thesportsdb
      team_id: "137142"            # men; women are 145688
    highlights:
      # rights sit with the home board, so swap the second one per tour
      - type: youtube_channel
        name: England & Wales Cricket Board
        handle: "https://www.youtube.com/channel/UCz1D0n02BR3t51KuBOPmfTQ"
        match_on: aliases
      - type: youtube_channel
        name: Cricket Australia      # Nov 2026 white-ball tour; swap for Cricket South Africa in Dec
        handle: "https://www.youtube.com/@cricketcomau"
        match_on: aliases

  - id: bath
    kind: team
    sport: rugby
    name: Bath Rugby
    aliases: ["Bath Rugby", "Bath"]
    exclude: []
    title_must_mention: true
    news:
      - type: google_news
        query: '"Bath Rugby"'
        lang: en-GB
    fixtures:
      provider: thesportsdb
      team_id: "135199"
    highlights:
      - type: youtube_channel
        name: PREM Rugby
        handle: "https://www.youtube.com/@PREM-Rugby"
        match_on: aliases
      - type: youtube_channel
        name: Investec Champions Cup (EPCR)
        handle: "https://www.youtube.com/@InvestecChampionsCup"
        match_on: aliases
      - type: youtube_channel
        name: Bath Rugby
        handle: TODO
        match_on: all

  - id: ubb
    kind: team
    sport: rugby
    name: Union Bordeaux-Bègles
    aliases: ["UBB", "Union Bordeaux-Bègles", "Bordeaux-Bègles", "Bordeaux Bègles"]
    exclude: ["Elite 1", "WXV", "Bleues", "féminine", "féminines", "Espoirs"]
    title_must_mention: true
    news:
      - type: google_news
        query: '"Bordeaux-Bègles" OR "UBB" rugby'
        lang: fr-FR
      - type: google_news
        query: '"Bordeaux-Bègles"'
        lang: en-GB
    fixtures:
      provider: thesportsdb
      team_id: "135329"            # not Stade Bordelais (148370)
    highlights:
      - type: youtube_channel
        name: Investec Champions Cup (EPCR)
        handle: "https://www.youtube.com/@InvestecChampionsCup"
        match_on: aliases
      - type: youtube_channel
        name: Top 14
        handle: "https://www.youtube.com/@top14"              # check what's actually posted here
        match_on: aliases
      - type: youtube_channel
        name: Union Bordeaux-Bègles
        handle: "https://www.youtube.com/@ubbrugby33"
        match_on: all

  - id: scotland-rugby
    kind: team
    sport: rugby
    name: Scotland men
    aliases: ["Scotland rugby", "Scotland"]
    exclude: ["Scotland women", "U20", "Under-20", "Scotland A", "South of Scotland", "club rugby", "Club XV", "clubhouse", "clubhouses"]
    title_must_mention: true
    news:
      - type: google_news
        query: '"Scotland" rugby -women -U20'
        lang: en-GB
    fixtures:
      provider: thesportsdb
      team_id: "137136"            # men; women are 150801
    highlights:
      - type: youtube_channel
        name: Six Nations Rugby
        handle: "https://www.youtube.com/@SixNationsRugby"
        match_on: aliases
      - type: youtube_channel
        name: Nations Championship   # November internationals
        handle: "https://www.youtube.com/@NationsChampionship"
        match_on: aliases
      - type: youtube_channel
        name: Scottish Rugby
        handle: "https://www.youtube.com/ScottishRugbyTV"   # from Scottish Rugby's own listings; check it opens
        match_on: all              # excludes above still apply

  - id: pepperell
    kind: player
    sport: golf
    name: Eddie Pepperell
