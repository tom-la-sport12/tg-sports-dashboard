<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tom’s sport</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tom’s sport">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%233B5BFF'/><text x='32' y='43' font-family='Arial' font-weight='700' font-size='28' fill='white' text-anchor='middle'>TS</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --accent { syntax: "<color>"; inherits: true; initial-value: #FFFFFF; }
:root {
  color-scheme: dark;
  --bg: #08090B;
  --card: #15171B;
  --raised: #1E2127;
  --ink: #FFFFFF;
  --muted: #9BA3AF;
  --dim: #7C838E;
  --line: #1C1F24;
  --accent: #FFFFFF;
  --on-accent: #08090B;
  --new: #E8204A;
  --up: #3DD68C;
  --scrim: rgba(0, 0, 0, .7);
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  transition: --accent .45s ease;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.4 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

.wrap { max-width: 46rem; margin: 0 auto; padding: 1rem 1.1rem calc(6rem + env(safe-area-inset-bottom, 0px)); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { font: italic 800 clamp(1.6rem, 7.4vw, 1.9rem)/1 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; white-space: nowrap; }
.personalise {
  display: inline-flex; align-items: center; gap: .4rem; flex: none; height: 2.75rem;
  border: 1px solid #2A2D33; background: var(--card); border-radius: 999px;
  padding: 0 .9rem; font-size: .85rem; font-weight: 600; cursor: pointer;
}
.today { font: 500 .85rem/1.2 var(--body); margin: .3rem 0 0; color: var(--muted); }
.updated { margin-left: .4rem; color: var(--dim); }
.notice { margin: .8rem 0 0; padding: .65rem .85rem; border-radius: 12px; background: var(--card); font-size: .88rem; }
.status { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.status:empty { display: none; }
.quiet { margin: 0; font-size: .8rem; color: var(--muted); }
.quiet summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: .35rem; }
.quiet summary::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: #E0A100; }
.quiet summary::-webkit-details-marker { display: none; }
.quiet ul { margin: .4rem 0 0; padding-left: 1.1rem; }

/* scores strip */
.strip { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; margin: 1rem -1.1rem 0; padding: 0 1.1rem .9rem; border-bottom: 1px solid var(--line); scroll-snap-type: x proximity; scroll-padding-inline: 1.1rem; }
.strip::-webkit-scrollbar { display: none; }
.sc { flex: none; width: 7.4rem; display: flex; flex-direction: column; gap: .35rem; padding: .6rem .75rem; border-radius: 14px; background: var(--card); border: 0; text-align: left; cursor: pointer; scroll-snap-align: start; position: relative; }
.sc .st { font-size: .64rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.sc .tm { display: flex; align-items: center; gap: .4rem; font-weight: 700; font-size: .88rem; }
.sc .tm .crest { width: 1rem; height: 1rem; }
.sc .tm .crest .init { font-size: .45rem; }
.sc .tm b { margin-left: auto; font: 800 1.08rem/1 var(--display); }
.sc .tm.lost { color: var(--muted); font-weight: 500; }
.sc .dot-new { position: absolute; top: .55rem; right: .6rem; margin: 0; }

/* stories row (follows) */
.rail { display: flex; gap: .85rem; overflow-x: auto; scrollbar-width: none; margin: 1rem -1.1rem 0; padding: 0 1.1rem .2rem; scroll-snap-type: x proximity; scroll-padding-inline: 1.1rem; }
.rail::-webkit-scrollbar { display: none; }
.follow { flex: none; width: 4.1rem; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .35rem; scroll-snap-align: start; }
.ring { position: relative; width: 3.8rem; height: 3.8rem; border-radius: 50%; padding: 3px; background: #2A2D33; }
.ring.fresh { background: var(--ringc, linear-gradient(135deg, #4FB3FF, #9B5CF6)); }
.ring .av { width: 100%; height: 100%; border: 3px solid var(--bg); background: var(--raised); }
.follow[aria-pressed="true"] .ring { outline: 2px solid #FFFFFF; outline-offset: 2px; }
.follow-name { font-size: .72rem; line-height: 1.15; text-align: center; color: var(--muted); max-width: 100%; }
.follow[aria-pressed="true"] .follow-name, .ring.fresh + .follow-name { color: var(--ink); font-weight: 600; }

/* avatars and crests */
.av { display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: var(--raised); color: var(--muted); font: 700 .85rem/1 var(--body); }
.av img { width: 100%; height: 100%; object-fit: contain; padding: 12%; }
.av.photo img { object-fit: cover; padding: 0; }
.crest { width: 2rem; height: 2rem; flex: none; display: grid; place-items: center; }
.crest img { width: 100%; height: 100%; object-fit: contain; }
.crest .init { width: 100%; height: 100%; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font: 700 .72rem/1 var(--body); color: var(--muted); }

/* view and transitions */
.view { min-height: 60vh; }
@media (prefers-reduced-motion: no-preference) {
  .view.enter > * { animation: enter .32s cubic-bezier(.2, .8, .2, 1) both; }
  .view.enter > *:nth-child(2) { animation-delay: .04s; }
  .view.enter > *:nth-child(3) { animation-delay: .08s; }
  .view.enter > *:nth-child(n+4) { animation-delay: .12s; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
}
.skel { background: var(--card); border-radius: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .skel { background: linear-gradient(90deg, var(--card) 25%, var(--raised) 50%, var(--card) 75%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position: -150% 0; } }
}
.skel-hero { height: 22rem; border-radius: 22px; margin-top: 1.2rem; }
.skel-line { height: 1.3rem; width: 35%; margin: 1.6rem 0 .7rem; }
.skel-row { height: 5rem; margin-bottom: .5rem; }

/* sections */
section { margin-top: 1.6rem; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 0 .7rem; }
h2 { font: 800 1.4rem/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; }
.see-all { border: 0; background: none; color: var(--muted); font-weight: 600; font-size: .85rem; cursor: pointer; padding: .4rem 0; }
.empty { color: var(--muted); font-size: .92rem; margin: 0; padding: 1rem; background: var(--card); border-radius: 16px; }
.subhead { font: 800 1.05rem/1.2 var(--display); text-transform: uppercase; color: var(--muted); margin: 0 0 .55rem; }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tc, var(--muted)); }
.pill-new { display: inline-block; font: 800 .64rem/1 var(--body); padding: .25rem .45rem; border-radius: 999px; background: var(--new); color: #fff; letter-spacing: .03em; }
.dot-new { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--new); margin-right: .4rem; vertical-align: middle; }

/* featured */
.feature { position: relative; display: block; width: 100%; height: 26rem; border-radius: 22px; overflow: hidden; background: var(--card); border: 0; padding: 0; text-align: left; cursor: pointer; margin-top: 1.2rem; text-decoration: none; }
.feature > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.feature .shade { position: absolute; left: 0; right: 0; bottom: 0; padding: 6rem 1.1rem 1.1rem; background: linear-gradient(180deg, rgba(8,9,11,0) 0%, rgba(8,9,11,.93) 55%); display: flex; flex-direction: column; gap: .45rem; }
.feature .kicker { position: absolute; left: .9rem; top: .9rem; display: inline-flex; align-items: center; gap: .35rem; font-size: .72rem; font-weight: 700; padding: .35rem .65rem; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
.feature .ftitle { font: 800 2.05rem/.98 var(--display); text-transform: uppercase; margin: 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.feature .fmeta { font-size: .82rem; color: var(--muted); margin: 0; }
.feature .save { top: .8rem; right: .8rem; }
.feature .fcover { position: absolute; inset: 0; z-index: 1; color: inherit; text-decoration: none; }

/* next up */
.nextup { display: block; width: 100%; border: 0; padding: 0; text-align: left; cursor: pointer; border-radius: 20px; overflow: hidden; background: var(--card); }
.nextup .bar { height: 6px; }
.nextup .teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: .5rem; padding: 1.1rem 1rem; }
.nextup .side { display: flex; flex-direction: column; align-items: center; gap: .5rem; text-align: center; font: 800 1.25rem/1.05 var(--display); text-transform: uppercase; }
.nextup .side .crest { width: 4rem; height: 4rem; }
.nextup .mid { text-align: center; display: flex; flex-direction: column; gap: .25rem; }
.nextup .mid b { font: 800 2rem/1 var(--display); }
.nextup .mid span { font-size: .7rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.nextup .foot { display: flex; justify-content: space-between; gap: 1rem; padding: .75rem 1rem; border-top: 1px solid #23262C; font-size: .82rem; color: var(--muted); }
.nextup .foot strong { color: var(--ink); font-weight: 700; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .35rem; margin-top: 1.2rem; }
.day { border: 0; border-radius: 14px; padding: .5rem 0 .45rem; background: var(--card); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .1rem; transition: background-color .2s, color .2s; }
.day small { font-size: .66rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.day strong { font: 800 1.4rem/1.1 var(--display); }
.dots { display: flex; gap: 3px; height: 6px; margin-top: .15rem; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.day.is-today strong { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.day[aria-pressed="true"] { background: #FFFFFF; color: #08090B; }
.day[aria-pressed="true"] small { color: #08090B; }
.day[aria-pressed="true"] .dots i { background: #08090B; }

/* segmented control */
.seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: .4rem .85rem; border-radius: 999px; font-size: .85rem; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: #FFFFFF; color: #08090B; }

/* grouped lists */
.group { background: var(--card); border-radius: 18px; overflow: hidden; }
.row { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: .85rem 1rem; }
.row + .row { border-top: 1px solid #23262C; }
.match { display: grid; grid-template-columns: 1fr auto; gap: .25rem 1rem; align-items: center; }
.comp { grid-column: 1 / -1; font-size: .74rem; color: var(--muted); display: flex; gap: .5rem; align-items: center; }
.lines { display: grid; gap: .4rem; }
.team { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.team .crest { width: 1.6rem; height: 1.6rem; }
.tname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.team.won .tname, .team.mine .tname { font-weight: 700; }
.pts { font: 800 1.5rem/1 var(--display); min-width: 1.8rem; text-align: right; }
.team.lost .pts, .team.lost .tname { color: var(--muted); }
.side-info { text-align: right; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.side-info strong { display: block; color: var(--ink); font: 800 1.1rem/1.1 var(--display); text-transform: uppercase; }
.txt-result { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }

/* golf */
.golfcard { background: var(--card); border-radius: 18px; overflow: hidden; }
.golfcard + .golfcard { margin-top: .7rem; }
.golf { display: flex; align-items: center; gap: .85rem; padding: .85rem 1rem; }
.golf .av { width: 3rem; height: 3rem; }
.golf-txt { flex: 1; min-width: 0; }
.golf-txt strong { display: block; font: 800 1.15rem/1.1 var(--display); text-transform: uppercase; }
.golf-txt span { font-size: .8rem; color: var(--muted); }
.golf-pos { text-align: right; font: 800 2.1rem/1 var(--display); }
.golf-pos span { display: block; font: 500 .8rem/1.3 var(--body); color: var(--muted); }
.board-list { border-top: 1px solid #23262C; padding: .35rem 0; }
.lb { display: grid; grid-template-columns: 2.6rem 1fr auto 2.6rem; gap: .5rem; align-items: center; padding: .32rem 1rem; font-size: .88rem; }
.lb .p { font: 800 1.05rem/1 var(--display); color: var(--muted); }
.lb .s { font: 800 1.05rem/1 var(--display); text-align: right; }
.lb.me { background: var(--raised); }
.lb.me .n { font-weight: 700; }
.lb-gap { text-align: center; color: var(--muted); font-size: .8rem; line-height: 1; padding: .1rem 0; }
.mv { font: 700 .74rem/1 var(--body); text-align: right; }
.mv.up { color: var(--up); }
.mv.down { color: #FF6B81; }
.mv.same { color: var(--muted); }
.golf-day { display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem; }
.golf-day + .row, .row + .golf-day { border-top: 1px solid #23262C; }
.golf-day .av { width: 2rem; height: 2rem; }

/* videos */
.vrail, .srail { display: flex; align-items: flex-start; overflow-x: auto; scrollbar-width: none; margin: 0 -1.1rem 1.2rem; padding: 0 1.1rem .3rem; scroll-snap-type: x mandatory; scroll-padding-inline: 1.1rem; }
.vrail { gap: .75rem; }
.srail { gap: .5rem; }
.vrail::-webkit-scrollbar, .srail::-webkit-scrollbar { display: none; }
.vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem .7rem; }
@media (min-width: 40rem) { .vgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.vcard, .scard { position: relative; flex: none; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; scroll-snap-align: start; }
.vcard { width: 16rem; }
.vgrid .vcard { width: auto; }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--card); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
.thumb .tag-new { position: absolute; left: .5rem; top: .5rem; }
.vtitle { margin: .5rem 0 0; font-weight: 600; font-size: .9rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vgrid .vtitle { font-size: .84rem; }
.vmeta { margin: .15rem 0 0; font-size: .76rem; color: var(--muted); }
/* "For you": tall cards, title over the picture */
.scard { width: 8.4rem; height: 14.9rem; border-radius: 16px; overflow: hidden; background: var(--card); }
.scard > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scard .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.6rem .6rem .6rem; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.88)); }
.scard .over p { margin: 0; font-weight: 700; font-size: .8rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.scard .tag-new { position: absolute; left: .45rem; top: .45rem; }
.watched .thumb img, .scard.watched > img { opacity: .4; }
.watched .vtitle { color: var(--muted); }
.watched-badge { position: absolute; right: .5rem; bottom: .5rem; display: inline-flex; align-items: center; gap: .25rem; font: 600 .68rem/1 var(--body); padding: .3rem .45rem; border-radius: 999px; background: rgba(0,0,0,.75); color: #fff; }
.scard .watched-badge { bottom: auto; top: 2.6rem; right: .45rem; }
.save { position: absolute; z-index: 2; border: 0; cursor: pointer; display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; transition: transform .15s, background-color .2s; }
.save svg { width: 1rem; height: 1rem; }
.save[aria-pressed="true"] { background: #FFFFFF; color: #08090B; }
.save[aria-pressed="true"] path { fill: currentColor; }
.save:active { transform: scale(.88); }
.vcard > .save, .scard > .save { top: .45rem; right: .45rem; }

/* news */
.stories { display: flex; flex-direction: column; }
.story { position: relative; display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: .8rem; align-items: start; padding: .75rem 0; border-bottom: 1px solid var(--line); }
.story a.cover { text-decoration: none; display: contents; }
.story a.cover::after { content: ""; position: absolute; inset: 0; }
.story-pic { width: 6rem; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--card); display: grid; place-items: center; grid-row: 1; grid-column: 1; }
.story-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.story-pic img.logo { width: 1.75rem; height: 1.75rem; object-fit: contain; border-radius: 6px; }
.story-txt { display: flex; flex-direction: column; gap: .3rem; grid-row: 1; grid-column: 2; padding-right: 2.4rem; }
.story-title { font-weight: 600; font-size: .98rem; line-height: 1.25; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.story-meta { margin: 0; font-size: .76rem; color: var(--muted); }
.story .save { position: absolute; right: 0; top: .75rem; width: 2rem; height: 2rem; background: var(--card); color: var(--muted); }
.story .save[aria-pressed="true"] { background: #FFFFFF; color: #08090B; }
.more { display: block; width: 100%; margin-top: .8rem; padding: .8rem; border-radius: 14px; border: 0; background: var(--card); font-weight: 700; cursor: pointer; }

/* bottom tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: .35rem .5rem calc(.35rem + env(safe-area-inset-bottom, 0px)); background: rgba(8, 9, 11, .94); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.tabs { max-width: 32rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { position: relative; border: 0; background: none; cursor: pointer; padding: .35rem 0 .2rem; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: .15rem; font-size: .68rem; font-weight: 600; transition: color .2s; }
.tab svg { width: 1.45rem; height: 1.45rem; }
.tab[aria-current="page"] { color: #FFFFFF; font-weight: 700; }
.tab .badge { position: absolute; top: 0; left: calc(50% + .5rem); min-width: 1.05rem; height: 1.05rem; padding: 0 .25rem; border-radius: 999px; background: #FFFFFF; color: #08090B; font: 800 .62rem/1.05rem var(--body); }

/* sheets */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 46rem; max-height: calc(100dvh - 2.5rem); border-radius: 22px 22px 0 0; background: var(--bg); color: var(--ink); overflow: hidden; }
dialog.sheet::backdrop { background: var(--scrim); }
@media (min-width: 48rem) { dialog.sheet { margin: auto; border-radius: 22px; max-height: min(52rem, calc(100dvh - 4rem)); } }
.sheet-inner { overflow-y: auto; max-height: inherit; padding: 0 1.1rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
.sheet-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 0 .7rem; background: var(--bg); }
.sheet-bar p { margin: 0; font-size: .85rem; color: var(--muted); }
.close { border: 0; width: 2.75rem; height: 2.75rem; border-radius: 50%; background: var(--card); cursor: pointer; font-size: 1.2rem; line-height: 1; flex: none; }
@media (prefers-reduced-motion: no-preference) {
  dialog.sheet[open] { animation: rise .26s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(2.5rem); opacity: 0; } }
}
.board { background: var(--card); border-radius: 20px; padding: 1.2rem 1rem; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .5rem; align-items: center; }
.board .hero-side { display: flex; flex-direction: column; align-items: center; gap: .5rem; text-align: center; font: 800 1.2rem/1.05 var(--display); text-transform: uppercase; }
.board .hero-side .crest { width: 4rem; height: 4rem; }
.big-score { font: 800 3.3rem/1 var(--display); text-align: center; white-space: nowrap; }
.big-score small { display: block; font: 700 .72rem/1.5 var(--body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .6rem; margin-top: .8rem; }
.fact { background: var(--card); border-radius: 14px; padding: .7rem .85rem; }
.fact span { display: block; font-size: .72rem; color: var(--muted); }
.fact strong { font-weight: 600; }
.actions { display: flex; gap: .6rem; margin-top: .8rem; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: .75rem 1rem; font-weight: 700; cursor: pointer; background: var(--card); text-decoration: none; display: inline-block; }
.btn.primary { background: #FFFFFF; color: #08090B; }
.sheet h3 { font: 800 1.2rem/1.1 var(--display); text-transform: uppercase; margin: 1.4rem 0 .6rem; }
.para { background: var(--card); border-radius: 14px; padding: .85rem 1rem; margin: 0; font-size: .92rem; line-height: 1.5; }
.player { aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; }
.player.short { aspect-ratio: 9 / 16; max-height: 70dvh; margin: 0 auto; }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 class="brand">Tom’s sport</h1>
      <button class="personalise" id="personalise">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        Personalise
      </button>
    </div>
    <p class="today"><span id="today"></span><span class="updated" id="updated">Loading…</span></p>
  </header>
  <div id="notices"></div>
  <nav class="rail" id="rail" aria-label="Choose who to show"></nav>

  <main class="view" id="view" aria-live="polite">
    <div class="skel" style="height:4.6rem;margin-top:1rem"></div>
    <div class="skel skel-hero"></div>
    <div class="skel skel-line"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-line"></div>
    <div class="skel skel-row"></div>
  </main>
  <footer id="status" class="status"></footer>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="tabs">
    <button class="tab" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>Home</button>
    <button class="tab" data-tab="matches">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 3v4M16 3v4M4 10h16"/></svg>Matches</button>
    <button class="tab" data-tab="videos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M10 9v6l5-3z"/></svg>Videos</button>
    <button class="tab" data-tab="news">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 9h8M8 13h8M8 17h5"/></svg>News</button>
    <button class="tab" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>Saved<span class="badge" id="saved-count" hidden></span></button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-inner" id="sheet-body"></div>
</dialog>

<script>
const RESULT_DAYS = 14;
const NEWS_PAGE = 15;
const VIDEO_PAGE = 12;
const STALE_HOURS = 12;
const SEEN_KEY = "mai-seen-v1";
const WATCHED_KEY = "toms-watched-v1";
const GENERIC = new Set(["union", "united", "club", "aviron", "stade", "rugby", "cricket", "football", "city", "town", "racing", "sporting"]);
const DAY = 864e5;

let data = null;
let filter = "all";
let tab = "home";
let matchTab = "results";
let selDay = null;          // "YYYY-MM-DD" when a day in the week strip is picked
let newsShown = NEWS_PAGE;
let videosShown = VIDEO_PAGE;
let fresh = new Set();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
filter = store.get("mai-filter", "all");
let watched = new Set(store.get(WATCHED_KEY, []));
const SAVED_KEY = "toms-saved-v1";
// saved items keep a copy of the story/video, so they survive after dropping out of the feed
let savedList = store.get(SAVED_KEY, []);
let saved = new Set(savedList.map(x => x.key));
function toggleSave(key) {
  if (saved.has(key)) {
    savedList = savedList.filter(x => x.key !== key);
  } else {
    const [kind, ...rest] = key.split(":"); const id = rest.join(":");
    const item = kind === "v" ? data.highlights.find(v => v.video_id === id) : data.news.find(n => n.url === id);
    if (!item) return;
    savedList.unshift({ key, kind, item, saved_at: new Date().toISOString() });
  }
  saved = new Set(savedList.map(x => x.key));
  store.set(SAVED_KEY, savedList.slice(0, 300));
  document.querySelectorAll(`[data-save="${CSS.escape(key)}"]`).forEach(b => {
    b.setAttribute("aria-pressed", saved.has(key));
    b.setAttribute("aria-label", (saved.has(key) ? "Remove from saved" : "Save for later") + b.getAttribute("aria-label").replace(/^[^:]*/, ""));
  });
  savedBadge();
  if (tab === "saved") render(false);
}
function savedBadge() {
  const b = $("saved-count");
  b.hidden = !savedList.length;
  b.textContent = savedList.length > 99 ? "99+" : savedList.length;
}

/* ---------- helpers ---------- */
const follow = (id) => data.follows.find(f => f.id === id) || { id, name: id, kind: "team", sport: "" };
const currentKind = () => filter === "all" ? "all" : follow(filter).kind;
function label(f) { return f.name.endsWith(" men") ? `${f.name.slice(0, -4)} ${f.sport}` : f.name; }
function shortName(f) {
  const map = { "Union Bordeaux-Bègles": "UBB", "Newcastle United": "Newcastle", "Fore Bros Golf": "Fore Bros" };
  return map[f.name] || (f.kind === "player" ? f.name.split(" ").slice(-1)[0] : label(f).replace(/ Rugby$/, ""));
}
const clean = (t) => (t || "").replace(/ (Rugby|Cricket)$/, "");
const initials = (s) => clean(s).split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
function crest(src, name) {
  const ini = esc(initials(name));
  return `<span class="crest">${src ? `<img src="${esc(src)}" alt="" loading="lazy" data-ini="${ini}">` : `<span class="init">${ini}</span>`}</span>`;
}
function avatar(f) {
  const cls = f.kind === "player" || f.kind === "creator" ? "av photo" : "av";
  const ini = esc(initials(f.name));
  return `<span class="${cls}">${f.image ? `<img src="${esc(f.image)}" alt="" loading="lazy" data-ini="${ini}">` : ini}</span>`;
}
function dayKey(d) { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function when(iso) {
  const d = new Date(iso);
  const days = Math.round((startOfDay(d) - startOfDay(Date.now())) / DAY);
  const time = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const date = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  let rel = date;
  if (days === 0) rel = "Today";
  else if (days === 1) rel = "Tomorrow";
  else if (days === -1) rel = "Yesterday";
  else if (days > 1 && days < 7) rel = d.toLocaleDateString("en-GB", { weekday: "long" });
  return { days, time, date, rel, long: d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) };
}
function countdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "under way";
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  if (d >= 1) return `${d} day${d > 1 ? "s" : ""}`;
  if (h >= 1) return `${h} hr${h > 1 ? "s" : ""}`;
  return `${Math.max(1, Math.round(ms / 6e4))} min`;
}
function ago(iso) {
  if (!iso) return "";
  const mins = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (mins < 60) return `${Math.max(mins, 1)} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hr ago`;
  const days = Math.round(hrs / 24);
  return days === 1 ? "yesterday" : `${days} days ago`;
}
const keep = (item) => filter === "all" || item.follow_id === filter;
const ytId = (url) => (String(url || "").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [])[1];
const thumbOf = (id) => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const posNum = (p) => { const m = String(p || "").match(/\d+/); return m ? +m[0] : null; };

// images that fail: crests and avatars fall back to initials, news pictures to the outlet logo
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  if (img.classList.contains("logo") || img.hasAttribute("data-hide")) { img.remove(); return; }
  if (img.dataset.ini !== undefined) {
    const span = document.createElement("span");
    span.className = img.parentNode.classList.contains("crest") ? "init" : "";
    span.textContent = img.dataset.ini;
    img.replaceWith(span);
    return;
  }
  if (img.dataset.logo !== undefined) {
    const host = img.dataset.logo;
    img.parentNode.innerHTML = host ? `<img class="logo" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="">` : "";
  }
}, true);

/* ---------- "new" tracking ---------- */
const keyOf = {
  news: n => `n:${n.url}`,
  video: v => `v:${v.video_id}`,
  match: m => `m:${m.source_id}:${m.status}`,
};
function trackNew() {
  const seen = store.get(SEEN_KEY, null);
  const keys = [
    ...data.news.map(keyOf.news),
    ...data.highlights.map(keyOf.video),
    ...data.matches.filter(m => m.kind === "team").map(keyOf.match),
  ];
  if (seen) {
    const s = new Set(seen);
    fresh = new Set(keys.filter(k => !s.has(k)));
    store.set(SEEN_KEY, [...new Set([...keys, ...seen])].slice(0, 3000));
  } else {
    store.set(SEEN_KEY, keys);
  }
}
const isNew = (kind, item) => fresh.has(keyOf[kind](item));
function newCount(fid) {
  return data.news.filter(n => n.follow_id === fid && isNew("news", n)).length
    + data.highlights.filter(v => v.follow_id === fid && isNew("video", v)).length
    + data.matches.filter(m => m.kind === "team" && m.follow_id === fid && isNew("match", m)).length;
}

/* ---------- follow rail ---------- */
function renderRail() {
  // stories row: a coloured ring means something new since your last visit
  const items = [{ id: "all", name: "Everything", kind: "all" }, ...data.follows];
  if (!items.some(i => i.id === filter)) filter = "all";
  $("rail").innerHTML = items.map(f => {
    const n = f.id === "all" ? fresh.size : newCount(f.id);
    const av = f.id === "all" ? `<span class="av" style="color:#fff;font-weight:800">All</span>` : avatar(f);
    const cols = f.id === "all" ? null : ringColours(f);
    const ring = n ? `ring fresh" style="--ringc:${cols ? `linear-gradient(135deg, ${cols[0]}, ${cols[1]})` : "linear-gradient(135deg, #4FB3FF, #9B5CF6)"}` : "ring";
    return `<button class="follow" data-follow="${esc(f.id)}" aria-pressed="${f.id === filter}" aria-label="${esc(f.id === "all" ? "Everything" : f.name)}${n ? `, ${n} new` : ""}">
      <span class="${ring}">${av}</span>
      <span class="follow-name">${esc(f.id === "all" ? "All" : shortName(f))}</span>
    </button>`;
  }).join("");
}

/* ---------- building blocks ---------- */
const teamMatches = () => data.matches.filter(m => m.kind === "team" && keep(m));
const golfItems = () => data.matches.filter(m => m.kind === "golf" && keep(m));

function mineSide(m) {
  if (m.side) return m.side;
  const fn = clean(follow(m.follow_id).name).split(" ")[0].toLowerCase();
  return clean(m.home).toLowerCase().includes(fn) ? "home" : "away";
}
function matchRow(m) {
  const side = mineSide(m);
  const s = m.score;
  const res = (who) => !s ? "" : s.home === s.away ? "" : ((who === "home") === (s.home > s.away) ? "won" : "lost");
  const teamLine = (who) => `<div class="team ${res(who)} ${side === who ? "mine" : ""}">
      ${crest(m[`${who}_badge`], m[who])}
      <span class="tname">${esc(clean(m[who]))}</span>
      ${s ? `<span class="pts">${s[who]}</span>` : ""}
    </div>`;
  const w = when(m.starts_at);
  const info = m.status === "finished"
    ? `<strong>FT</strong>${esc(w.days > -7 ? w.rel : w.date)}`
    : `<strong>${esc(w.time)}</strong>${esc(w.rel)}`;
  return `<button class="row" data-match="${esc(m.source_id)}">
    <div class="match">
      <div class="comp">${isNew("match", m) ? '<span class="dot-new" aria-label="New"></span>' : ""}${filter === "all" ? `<span class="tag" style="--tc:${fcol(m.follow_id)}">${esc(shortName(follow(m.follow_id)))}</span>` : ""}<span>${esc(m.competition || "")}</span></div>
      <div class="lines">${teamLine("home")}${teamLine("away")}</div>
      <div class="side-info">${info}</div>
      ${!s && m.result ? `<div class="txt-result">${esc(m.result)}</div>` : ""}
    </div>
  </button>`;
}
function teamCode(name) {
  const n = clean(name);
  const known = { "New Zealand": "NZL", "South Africa": "RSA", "Union Bordeaux Bègles": "UBB", "Union Bordeaux-Bègles": "UBB",
    "Aviron Bayonnais": "BAY", "Sale Sharks": "SAL", "Exeter Chiefs": "EXE", "Stade Toulousain": "TLS", "Stade Français": "SFP",
    "Racing 92": "R92", "Sri Lanka": "SL", "West Indies": "WI" };
  if (known[n]) return known[n];
  return n.split(/[\s-]+/)[0].slice(0, 3).toUpperCase();
}
function scoresStrip() {
  // NBA-style strip: last fortnight's results, then the week ahead
  const now = Date.now();
  const res = teamMatches().filter(m => m.status === "finished" && now - new Date(m.starts_at) < 14 * DAY)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const up = teamMatches().filter(m => m.status === "upcoming" && new Date(m.starts_at) - now < 8 * DAY && new Date(m.starts_at) > now - 3 * 36e5)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const list = [...res, ...up];
  if (!list.length) return "";
  const card = (m) => {
    const w = when(m.starts_at), s = m.score;
    const st = m.status === "finished" ? "Final" : `${w.days === 0 ? "Today" : w.days === 1 ? "Tmrw" : w.date.split(" ")[0]} ${w.time}`;
    const line = (who) => {
      const lost = s && s.home !== s.away && ((who === "home") !== (s.home > s.away));
      return `<span class="tm ${lost ? "lost" : ""}">${crest(m[`${who}_badge`], m[who])}${esc(teamCode(m[who]))}${s ? `<b>${s[who]}</b>` : ""}</span>`;
    };
    return `<button class="sc" data-match="${esc(m.source_id)}" aria-label="${esc(clean(m.home))} v ${esc(clean(m.away))}">
      ${isNew("match", m) ? '<span class="dot-new" aria-label="New"></span>' : ""}
      <span class="st">${esc(st)}</span>${line("home")}${line("away")}</button>`;
  };
  return `<div class="strip" aria-label="Scores">${list.map(card).join("")}</div>`;
}
function featuredBlock() {
  // the biggest thing right now: newest proper video, else newest story with a picture
  const v = data.highlights.filter(keep).filter(x => !x.short)[0];
  if (v) {
    const f = follow(v.follow_id);
    return `<div class="feature" data-video="${esc(v.video_id)}" role="button" tabindex="0">
      <img src="https://i.ytimg.com/vi/${esc(v.video_id)}/hqdefault.jpg" alt="" loading="eager">
      <span class="kicker"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M8 5v14l11-7z"/></svg>${/highlight/i.test(v.title) ? "Highlights" : "Video"}</span>
      ${saveBtn(`v:${v.video_id}`, v.title)}
      <div class="shade">
        <span class="tag" style="--tc:${fcol(v.follow_id)}">${isNew("video", v) ? '<span class="dot-new"></span>' : ""}${esc(shortName(f))}</span>
        <p class="ftitle">${esc(v.title)}</p>
        <p class="fmeta">${esc(v.channel)}${v.published_at ? `, ${ago(v.published_at)}` : ""}</p>
      </div>
    </div>`;
  }
  const n = (filter === "all" ? balanced(data.news) : data.news.filter(keep)).find(x => x.image);
  return n ? leadStory(n) : "";
}
function heroBlock() {
  const next = teamMatches().filter(m => m.status === "upcoming" && m.starts_at && new Date(m.starts_at) > Date.now() - 3 * 36e5)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0];
  if (!next) return "";
  const w = when(next.starts_at);
  const mine = mineSide(next);
  const c = ringColours(follow(next.follow_id));
  const bar = mine === "home" ? `${c[0]} 0 50%, #3A3E46 50% 100%` : `#3A3E46 0 50%, ${c[0]} 50% 100%`;
  return `<section><div class="head"><h2>Next up</h2></div>
    <button class="nextup" data-match="${esc(next.source_id)}" aria-label="Match centre: ${esc(clean(next.home))} v ${esc(clean(next.away))}">
      <div class="bar" style="background:linear-gradient(90deg, ${bar})"></div>
      <div class="teams">
        <div class="side">${crest(next.home_badge, next.home)}${esc(clean(next.home))}</div>
        <div class="mid"><b>${esc(w.time)}</b><span>${esc(w.rel)}${w.days > 0 ? `, ${countdown(next.starts_at)}` : ""}</span></div>
        <div class="side">${crest(next.away_badge, next.away)}${esc(clean(next.away))}</div>
      </div>
      <div class="foot"><span>${esc([next.competition, next.venue].filter(Boolean).join(", "))}</span><strong>Match centre</strong></div>
    </button></section>`;
}

function golfOnDay(g, key) {
  if (!g.dates || !g.dates.start) return false;
  const s = dayKey(g.dates.start), e = dayKey(g.dates.end || g.dates.start);
  return key >= s && key <= e;
}
function weekBlock() {
  const today = startOfDay(Date.now());
  const days = [...Array(7)].map((_, i) => new Date(today.getTime() + i * DAY));
  return `<div class="week" role="group" aria-label="This week">${days.map((d, i) => {
    const key = dayKey(d);
    const n = teamMatches().filter(m => m.starts_at && dayKey(m.starts_at) === key).length
      + golfItems().filter(g => golfOnDay(g, key)).length;
    return `<button class="day ${i === 0 ? "is-today" : ""}" data-day="${key}" aria-pressed="${selDay === key}" aria-label="${d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}, ${n} event${n === 1 ? "" : "s"}">
      <small>${i === 0 ? "Today" : d.toLocaleDateString("en-GB", { weekday: "short" })}</small>
      <strong>${d.getDate()}</strong>
      <span class="dots">${"<i></i>".repeat(Math.min(n, 3))}</span>
    </button>`;
  }).join("")}</div>`;
}
function dayBlock() {
  const ms = teamMatches().filter(m => m.starts_at && dayKey(m.starts_at) === selDay)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const gs = golfItems().filter(g => golfOnDay(g, selDay));
  const title = new Date(selDay + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const golfRows = gs.map(g => {
    const f = follow(g.follow_id);
    return `<div class="golf-day">${avatar(f)}<div class="golf-txt"><strong>${esc(f.name)}</strong><span>${esc(g.event || "")}</span></div></div>`;
  }).join("");
  return `<section><div class="head"><h2>${esc(title)}</h2><button class="see-all" data-clear-day>Show all</button></div>
    ${ms.length || gs.length ? `<div class="group">${ms.map(matchRow).join("")}${golfRows}</div>` : `<p class="empty">Nothing on for your teams.</p>`}
  </section>`;
}

/* matches list */
function matchesBlock(limit) {
  const cutoff = Date.now() - RESULT_DAYS * DAY;
  const all = teamMatches();
  const results = all.filter(m => m.status === "finished" && new Date(m.starts_at) >= cutoff)
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at));
  const upcoming = all.filter(m => m.status === "upcoming")
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const list = matchTab === "results" ? results : upcoming;
  const shown = limit ? list.slice(0, limit) : list;
  return `<section>
    <div class="head">
      <h2>Matches</h2>
      <div class="seg" role="group" aria-label="Results or upcoming">
        <button data-mtab="results" aria-pressed="${matchTab === "results"}">Results</button>
        <button data-mtab="upcoming" aria-pressed="${matchTab === "upcoming"}">Upcoming</button>
      </div>
    </div>
    ${shown.length ? `<div class="group">${shown.map(matchRow).join("")}</div>` : `<p class="empty">${matchTab === "results" ? `No results in the last ${RESULT_DAYS} days.` : "No fixtures found."}</p>`}
    ${limit && list.length > limit ? `<button class="more" data-go="matches">All matches</button>` : ""}
  </section>`;
}

/* golf with mini leaderboard */
function move(now, before) {
  const a = posNum(now), b = posNum(before);
  if (a === null || b === null) return `<span class="mv"></span>`;
  if (a < b) return `<span class="mv up" aria-label="up ${b - a}">▲${b - a}</span>`;
  if (a > b) return `<span class="mv down" aria-label="down ${a - b}">▼${a - b}</span>`;
  return `<span class="mv same" aria-label="no change">–</span>`;
}
function golfCard(m) {
  const f = follow(m.follow_id);
  const status = { upcoming: "starts soon", in_progress: m.round ? `round ${m.round}` : "in progress", finished: "finished" }[m.status] || "";
  const board = m.leaderboard || [];
  const mineInTop = board.some(r => String(r.id) === String(m.player_id));
  const lbRow = (r, me) => `<div class="lb ${me ? "me" : ""}"><span class="p">${esc(r.pos || "")}</span><span class="n">${esc(r.name)}</span><span class="s">${esc(r.to_par ?? "")}</span>${move(r.pos, r.prev_pos)}</div>`;
  const showBoard = board.length && m.status !== "upcoming";
  return `<div class="golfcard">
    <div class="golf">${avatar(f)}
      <div class="golf-txt"><strong>${esc(f.name)}</strong><span>${esc(m.event || "")}, ${status}</span></div>
      <div class="golf-pos">${esc(m.position || "")}<span>${esc(m.to_par ?? "")} ${m.prev_position ? move(m.position, m.prev_position) : ""}</span></div>
    </div>
    ${showBoard ? `<div class="board-list">
      ${board.map(r => lbRow(r, String(r.id) === String(m.player_id))).join("")}
      ${!mineInTop && m.position ? `<div class="lb-gap">···</div>${lbRow({ pos: m.position, name: f.name, to_par: m.to_par, prev_pos: m.prev_position }, true)}` : ""}
    </div>` : ""}
  </div>`;
}
function golfBlock() {
  const items = golfItems();
  if (!items.length && filter === "all") return "";
  return `<section><div class="head"><h2>Golf this week</h2></div>
    ${items.length ? items.map(golfCard).join("") : `<p class="empty">Not in a field this week.</p>`}
  </section>`;
}

/* videos */
function watchedBadge(v) {
  return watched.has(v.video_id) ? `<span class="watched-badge"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" d="M5 12l5 5 9-10"/></svg>Watched</span>` : "";
}
function saveBtn(key, title) {
  const on = saved.has(key);
  return `<button class="save" data-save="${esc(key)}" aria-pressed="${on}" aria-label="${on ? "Remove from saved" : "Save for later"}: ${esc(title)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg></button>`;
}
function videoCard(v) {
  return `<div class="vcard ${watched.has(v.video_id) ? "watched" : ""}" data-video="${esc(v.video_id)}" role="button" tabindex="0">
    ${saveBtn(`v:${v.video_id}`, v.title)}

}

function shortCard(v) {

  return `<div class="scard ${watched.has(v.video_id) ? "watched" : ""}" data-video="${esc(v.video_id)}" role="button" tabindex="0">
    <img src="${thumbOf(esc(v.video_id))}" alt="" loading="lazy">
    ${saveBtn(`v:${v.video_id}`, v.title)}

}

function videosBlock(limit) {
  const items = data.highlights.filter(keep);
  const long = items.filter(v => !v.short);
  const shorts = items.filter(v => v.short);
  if (!items.length) return `<section><div class="head"><h2>Videos</h2></div><p class="empty">No videos yet.</p></section>`;
  if (limit) {
    // home: the featured video is already at the top, so skip it here
    const rest = long.slice(1, limit + 1);
    return (shorts.length ? `<section><div class="head"><h2>For you</h2><button class="see-all" data-go="videos">See all</button></div>
        <div class="srail">${shorts.slice(0, limit).map(shortCard).join("")}</div></section>` : "")
      + (rest.length ? `<section><div class="head"><h2>Latest videos</h2>${shorts.length ? "" : `<button class="see-all" data-go="videos">See all</button>`}</div>
        <div class="vrail">${rest.map(videoCard).join("")}</div></section>` : "");
  }
  return (shorts.length ? `<section><div class="head"><h2>For you</h2></div><div class="srail">${shorts.map(shortCard).join("")}</div></section>` : "")
    + (long.length ? `<section><div class="head"><h2>Latest videos</h2></div><div class="vgrid">${long.slice(0, videosShown).map(videoCard).join("")}</div>
      ${long.length > videosShown ? `<button class="more" data-more-videos>Show more videos</button>` : ""}</section>` : "");
}

function balanced(list) {
  const buckets = {};
  list.forEach(n => (buckets[n.follow_id] = buckets[n.follow_id] || []).push(n));
  Object.values(buckets).forEach(b => b.sort((x, y) => new Date(y.published_at || 0) - new Date(x.published_at || 0)));
  const out = [];
  for (let round = 0; ; round++) {
    const batch = Object.values(buckets).map(b => b[round]).filter(Boolean);
    if (!batch.length) break;
    batch.sort((x, y) => new Date(y.published_at || 0) - new Date(x.published_at || 0));
    out.push(...batch);
  }
  return out;
}
function siteHost(n) { try { return new URL(n.site || n.article_url).hostname; } catch (e) { return ""; } }
function storyPic(n) {
  const host = siteHost(n);
  if (n.image) return `<span class="story-pic"><img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-logo="${esc(host)}"></span>`;
  return `<span class="story-pic">${host ? `<img class="logo" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="" loading="lazy">` : ""}</span>`;
}
function storyRow(n, showTag = true) {
  const f = follow(n.follow_id);
  return `<div class="story">
    <a class="cover" href="${esc(n.article_url || n.url)}" target="_blank" rel="noopener">
      ${storyPic(n)}
      <span class="story-txt">
        ${showTag && (filter === "all" || tab === "saved") ? `<span class="tag" style="--tc:${fcol(n.follow_id)}">${esc(shortName(f))}</span>` : ""}
        <span class="story-title">${isNew("news", n) ? '<span class="dot-new" aria-label="New"></span>' : ""}${esc(n.title)}</span>
        <span class="story-meta">${esc(n.source)}, ${ago(n.published_at)}</span>
      </span>
    </a>
    ${saveBtn(`n:${n.url}`, n.title)}
  </div>`;
}

function leadStory(n) {
  return `<div class="feature">
    <img src="${esc(n.image)}" alt="" referrerpolicy="no-referrer" data-hide>
    ${saveBtn(`n:${n.url}`, n.title)}
    <a class="fcover" href="${esc(n.article_url || n.url)}" target="_blank" rel="noopener"><div class="shade">
      <span class="tag" style="--tc:${fcol(n.follow_id)}">${isNew("news", n) ? '<span class="dot-new"></span>' : ""}${esc(shortName(follow(n.follow_id)))}</span>
      <p class="ftitle">${esc(n.title)}</p>
      <p class="fmeta">${esc(n.source)}, ${ago(n.published_at)}</p>
    </div></a>
  </div>`;
}

function newsBlock(limit) {
  const items = filter === "all" ? balanced(data.news) : data.news.filter(keep);
  if (!items.length) return currentKind() === "creator" ? "" : `<section><div class="head"><h2>Top stories</h2></div><p class="empty">No news found.</p></section>`;
  const n = limit || newsShown;
  let top = items.slice(0, n), lead = "";
  if (!limit) {
    // news tab: newest story with a picture leads, big
    const i = top.slice(0, 3).findIndex(x => x.image);
    if (i >= 0) { lead = leadStory(top[i]); top = top.filter((_, k) => k !== i); }
  }
  return `${lead}<section><div class="head"><h2>${limit ? "Top stories" : "News"}</h2>${limit ? `<button class="see-all" data-go="news">See all</button>` : ""}</div>
    <div class="stories">${top.map(x => storyRow(x)).join("")}</div>
    ${!limit && items.length > n ? `<button class="more" data-more-news>Show more news</button>` : ""}
  </section>`;
}

/* ---------- tabs ---------- */
function homeView() {
  const k = currentKind();
  if (k === "creator") return featuredBlock() + videosBlock(12) + newsBlock(5);
  if (k === "player") return featuredBlock() + golfBlock() + videosBlock(12) + newsBlock(5);
  return scoresStrip() + featuredBlock() + heroBlock() + golfBlock() + videosBlock(12) + newsBlock(5);
}

function matchesView() {
  const k = currentKind();
  if (k === "creator") return `<section><p class="empty">${esc(follow(filter).name)} is a creator, so there are no matches. Their videos are in the Videos tab.</p></section>`;
  if (k === "player") return weekBlock() + (selDay ? dayBlock() : golfBlock());
  return scoresStrip() + weekBlock() + (selDay ? dayBlock() : matchesBlock(0) + golfBlock());
}

function savedView() {
  const vids = savedList.filter(x => x.kind === "v").map(x => x.item);
  const stories = savedList.filter(x => x.kind === "n").map(x => x.item);
  if (!savedList.length) return `<section><div class="head"><h2>Saved</h2></div>
    <p class="empty">Nothing saved yet. Tap the bookmark on any story or video to keep it here, even after it drops out of the feed.</p></section>`;
  return `<section><div class="head"><h2>Saved</h2></div></section>
    ${vids.some(v => v.short) ? `<p class="subhead">Shorts</p><div class="srail">${vids.filter(v => v.short).map(shortCard).join("")}</div>` : ""}
    ${vids.some(v => !v.short) ? `<p class="subhead">Videos</p><div class="vgrid">${vids.filter(v => !v.short).map(videoCard).join("")}</div>` : ""}
    ${stories.length ? `<p class="subhead" style="margin-top:1.3rem">Stories</p><div class="stories">${stories.map(n => storyRow(n)).join("")}</div>` : ""}`;
}

const VIEWS = { saved: savedView, home: homeView, matches: matchesView, videos: () => videosBlock(0), news: () => newsBlock(0) };

/* ---------- team colours ---------- */
function hexRgb(h) { const m = String(h || "").trim().match(/^#?([0-9a-f]{6})$/i); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function lum(rgb) { return rgb.map(c => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; }).reduce((a, c, i) => a + c * [.2126, .7152, .0722][i], 0); }
function contrast(a, b) { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); }
// a team colour that reads on the black background (lightened if it's too dark)
function readable(hex) {
  const c = hexRgb(hex); if (!c) return null;
  let x = c; const bg = [8, 9, 11];
  for (let i = 0; i < 6 && contrast(x, bg) < 4.5; i++) x = x.map(v => Math.round(v + (255 - v) * .3));
  return "#" + x.map(v => v.toString(16).padStart(2, "0")).join("");
}
const SPORT_COLOURS = { golf: ["#2E8B57", "#9BE15D"], rugby: ["#8E2A4F", "#E0507F"], cricket: ["#1B3F8F", "#6F9BE8"], football: ["#FFFFFF", "#7C838E"] };
function ringColours(f) {
  const cols = (f.colours && f.colours.length ? f.colours : SPORT_COLOURS[f.sport] || ["#4FB3FF", "#9B5CF6"]).map(readable).filter(Boolean);
  return [cols[0] || "#4FB3FF", cols[1] || cols[0] || "#9B5CF6"];
}
function fcol(fid) { return ringColours(follow(fid))[0]; }
function applyTheme() {
  const root = document.documentElement.style;
  if (filter === "all") { root.removeProperty("--accent"); root.removeProperty("--on-accent"); return; }
  const a = fcol(filter);
  root.setProperty("--accent", a);
  root.setProperty("--on-accent", lum(hexRgb(a)) > .35 ? "#08090B" : "#FFFFFF");
}


function render(animate = true) {
  applyTheme();
  savedBadge();
  renderRail();
  document.querySelectorAll(".tab").forEach(t => t.dataset.tab === tab ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
  const view = $("view");
  view.innerHTML = VIEWS[tab]();
  if (animate) { view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter"); }
  bindCards(view);
}
function go(t) {
  tab = t;
  if (t !== "matches") selDay = null;
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  render();
}

/* ---------- match centre ---------- */
function tokens(name) {
  return clean(name).split(/[\s-]+/).map(w => w.toLowerCase())
    .filter(w => w.length >= 4 && !GENERIC.has(w)).map(w => w.slice(0, 5));
}
function mentionsOpponent(text, m) {
  const opp = mineSide(m) === "home" ? m.away : m.home;
  const t = String(text).toLowerCase();
  return tokens(opp).some(tok => new RegExp(`(^|[^\\p{L}])${tok}`, "u").test(t));
}
function nearMatch(iso, m, before = 3, after = 4) {
  const d = new Date(iso) - new Date(m.starts_at);
  return d > -before * DAY && d < after * DAY;
}
function relatedNews(m) {
  return data.news.filter(n => n.follow_id === m.follow_id && n.published_at && nearMatch(n.published_at, m) && mentionsOpponent(n.title, m)).slice(0, 8);
}
function relatedVideos(m) {
  const vids = data.highlights.filter(v => v.follow_id === m.follow_id && v.published_at && nearMatch(v.published_at, m, 1, 5) && mentionsOpponent(v.title, m));
  const official = ytId(m.video);
  if (official && !vids.some(v => v.video_id === official))
    vids.unshift({ video_id: official, title: `${clean(m.home)} v ${clean(m.away)} highlights`, channel: "Match highlights", published_at: null });
  return vids.slice(0, 6);
}
function icsFor(m) {
  const fmt = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const start = new Date(m.starts_at);
  const end = new Date(start.getTime() + 2.5 * 36e5);
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Toms sport//EN", "BEGIN:VEVENT",
    `UID:${m.source_id}@toms-sport`, `DTSTAMP:${fmt(new Date())}`, `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
    `SUMMARY:${clean(m.home)} v ${clean(m.away)}`, `LOCATION:${[m.venue, m.city].filter(Boolean).join(", ")}`,
    `DESCRIPTION:${m.competition || ""}`, "END:VEVENT", "END:VCALENDAR"];
  return URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
}
function openSheet(html) {
  $("sheet-body").innerHTML = html;
  const d = $("sheet");
  if (!d.open) d.showModal();
  $("sheet-body").scrollTop = 0;
  d.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => d.close()));
  bindCards(d);
}
function renderMatchCentre(id) {
  const m = data.matches.find(x => String(x.source_id) === String(id) && x.kind === "team");
  if (!m) return false;
  const side = mineSide(m);
  const w = when(m.starts_at);
  const done = m.status === "finished";
  const sideBlock = (who) => `<div class="hero-side ${side === who ? "mine" : ""}">${crest(m[`${who}_badge`], m[who])}${esc(clean(m[who]))}</div>`;
  const centre = done
    ? (m.score ? `<div class="big-score">${m.score.home}–${m.score.away}<small>Full time</small></div>` : `<div class="big-score" style="font-size:1.6rem">Played<small>Full time</small></div>`)
    : `<div class="big-score">${esc(w.time)}<small>${esc(w.rel)}, in ${countdown(m.starts_at)}</small></div>`;
  const facts = [
    ["Date", w.long],
    [done ? "Kicked off" : "Kick-off", w.time],
    m.venue && ["Venue", [m.venue, m.city].filter(Boolean).join(", ")],
    m.round && ["Round", m.round],
    m.spectators && ["Attendance", Number(m.spectators).toLocaleString("en-GB")],
  ].filter(Boolean);
  const vids = relatedVideos(m);
  const news = relatedNews(m);
  openSheet(`
    <div class="sheet-bar"><p id="sheet-title">${esc(m.competition || "Match centre")}</p><button class="close" data-close aria-label="Close">×</button></div>
    <div class="board">${sideBlock("home")}${centre}${sideBlock("away")}</div>
    ${m.result && !m.score ? `<p class="para" style="margin-top:.8rem">${esc(m.result)}</p>` : ""}
    <div class="facts">${facts.map(([k, v]) => `<div class="fact"><span>${k}</span><strong>${esc(v)}</strong></div>`).join("")}</div>
    ${!done && m.starts_at ? `<div class="actions"><a class="btn primary" href="${icsFor(m)}" download="${esc(clean(m.home))}-v-${esc(clean(m.away))}.ics">Add to calendar</a></div>` : ""}
    ${m.description ? `<h3>Preview</h3><p class="para">${esc(m.description)}</p>` : ""}
    <h3>Videos</h3>
    ${vids.length ? `<div class="vrail">${vids.map(videoCard).join("")}</div>` : `<p class="empty">${done ? "No highlights found for this match yet." : "Videos appear here around the match."}</p>`}
    <h3>News</h3>
    ${news.length ? `<div class="stories">${news.map(n => storyRow(n, false)).join("")}</div>` : `<p class="empty">No stories about this match yet.</p>`}
  `);
  return true;
}
function markWatched(id) {
  if (watched.has(id)) return;
  watched.add(id);
  store.set(WATCHED_KEY, [...watched].slice(-1000));
}
function renderPlayer(id) {
  const v = data.highlights.find(x => x.video_id === id) || { video_id: id, title: "Video", channel: "", short: false };
  markWatched(id);
  openSheet(`
    <div class="sheet-bar"><p id="sheet-title">${esc(v.channel || "Video")}</p><button class="close" data-close aria-label="Close">×</button></div>
    <div class="player ${v.short ? "short" : ""}"><iframe src="https://www.youtube-nocookie.com/embed/${esc(v.video_id)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(v.title)}"></iframe></div>
    <h3 style="margin-top:1rem">${esc(v.title)}</h3>
    ${v.published_at ? `<p class="story-meta">${ago(v.published_at)}</p>` : ""}
  `);
}

/* ---------- routing for sheets: #match-123 and #video-abc; back closes ---------- */
function route() {
  const h = location.hash.slice(1);
  const d = $("sheet");
  if (h.startsWith("match-") && data && renderMatchCentre(h.slice(6))) return;
  if (h.startsWith("video-") && data) { renderPlayer(h.slice(6)); return; }
  if (d.open) d.close();
}
$("sheet").addEventListener("close", () => {
  const wasVideo = /^#video-/.test(location.hash);
  $("sheet-body").innerHTML = "";
  if (/^#(match|video)-/.test(location.hash)) history.back();
  if (wasVideo) render(false);  // show the watched marker straight away
});
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").close(); });
window.addEventListener("hashchange", route);

/* ---------- one click handler for everything ---------- */
function bindCards(root) {
  root.querySelectorAll("[data-match]").forEach(b => b.onclick = () => { location.hash = `match-${b.dataset.match}`; });
  root.querySelectorAll("[data-video]").forEach(b => {
    b.onclick = (e) => {
      if (e.target.closest("[data-save]")) return;
      if (location.hash.startsWith("#match-")) history.replaceState(null, "", location.pathname);
      location.hash = `video-${b.dataset.video}`;
    };
    b.onkeydown = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === b) { e.preventDefault(); b.click(); } };
  });
}
document.addEventListener("click", (e) => {
  const sv = e.target.closest("[data-save]");
  if (sv) { e.preventDefault(); toggleSave(sv.dataset.save); return; }
  const t = e.target.closest("[data-follow],[data-tab],[data-mtab],[data-day],[data-clear-day],[data-go],[data-more-news],[data-more-videos]");
  if (!t) return;
  if (t.dataset.follow) {
    filter = t.dataset.follow; newsShown = NEWS_PAGE; videosShown = VIDEO_PAGE;
    store.set("mai-filter", filter); render();
  } else if (t.dataset.tab) {
    go(t.dataset.tab);
  } else if (t.dataset.mtab) {
    matchTab = t.dataset.mtab; render(false);
  } else if (t.dataset.day) {
    selDay = selDay === t.dataset.day ? null : t.dataset.day;
    if (tab !== "matches") go("matches"); else render();
  } else if (t.hasAttribute("data-clear-day")) {
    selDay = null; render();
  } else if (t.dataset.go) {
    go(t.dataset.go);
  } else if (t.hasAttribute("data-more-news")) {
    newsShown += NEWS_PAGE; render(false);
  } else if (t.hasAttribute("data-more-videos")) {
    videosShown += VIDEO_PAGE; render(false);
  }
});
$("personalise").addEventListener("click", () => openSheet(`
  <div class="sheet-bar"><p id="sheet-title">Personalise</p><button class="close" data-close aria-label="Close">×</button></div>
  <p class="empty">Coming soon.</p>
`));

/* ---------- start ---------- */
async function load() {
  $("today").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    $("updated").textContent = "couldn’t load data";
    $("view").innerHTML = `<p class="notice">data.json didn’t load. Check the fetch workflow has run at least once.</p>`;
    return;
  }
  data.follows = data.follows || []; data.news = data.news || []; data.matches = data.matches || [];
  data.highlights = data.highlights || []; data.errors = data.errors || [];
  $("updated").textContent = `Updated ${ago(data.generated_at)}`;
  const notes = [];
  if ((Date.now() - new Date(data.generated_at)) / 36e5 > STALE_HOURS)
    notes.push("This data is more than 12 hours old. Check the Actions tab on GitHub for a failed run.");
  $("notices").innerHTML = notes.map(n => `<p class="notice">${esc(n)}</p>`).join("");
  if (data.errors.length) {
    // a quiet one-liner; details only if you tap
    const stale = data.errors.every(e => e.stale);
    const list = data.errors.map(e => `<li>${esc(shortName(follow(e.follow_id)))}: ${esc(e.source)}${e.stale ? " (showing earlier content)" : ""}</li>`).join("");
    $("status").insertAdjacentHTML("beforeend", `<details class="quiet">
      <summary>${data.errors.length} source${data.errors.length > 1 ? "s" : ""} didn’t refresh${stale ? ", showing their earlier content" : ""}</summary>
      <ul>${list}</ul></details>`);
  }
  const recent = data.matches.some(m => m.kind === "team" && m.status === "finished" && Date.now() - new Date(m.starts_at) < 3 * DAY);
  matchTab = recent ? "results" : "upcoming";
  trackNew();
  render();
  route();
}
load();
</script>
</body>
</html>
